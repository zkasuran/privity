<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Privity">
  <title>Privity</title>
  <desc>A register of holdings with one parcel lifted out and disclosed. The rest stays dark.</desc>

  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141A26"/>
      <stop offset="1" stop-color="#0B0D12"/>
    </linearGradient>
    <linearGradient id="parcel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B8BFF"/>
      <stop offset="1" stop-color="#2D55FF"/>
    </linearGradient>
    <filter id="lift" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2D55FF" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#field)"/>

  <!-- The register: a grid of holdings. Deliberately dim, because most of the book is
       never disclosed to a counterparty. -->
  <g fill="#2A3242">
    <rect x="112" y="128" width="96" height="40" rx="10"/>
    <rect x="224" y="128" width="96" height="40" rx="10"/>
    <rect x="336" y="128" width="64" height="40" rx="10"/>

    <rect x="112" y="184" width="64" height="40" rx="10"/>
    <rect x="192" y="184" width="96" height="40" rx="10"/>
    <rect x="304" y="184" width="96" height="40" rx="10"/>

    <rect x="112" y="296" width="96" height="40" rx="10"/>
    <rect x="224" y="296" width="64" height="40" rx="10"/>
    <rect x="304" y="296" width="96" height="40" rx="10"/>

    <rect x="112" y="352" width="64" height="40" rx="10"/>
    <rect x="192" y="352" width="96" height="40" rx="10"/>
    <rect x="304" y="352" width="96" height="40" rx="10"/>
  </g>

  <!-- The parcel: exactly one row, lifted out and lit. This is the whole idea. The buyer
       can read this and nothing else. -->
  <g filter="url(#lift)">
    <rect x="112" y="236" width="288" height="44" rx="12" fill="url(#parcel)"/>
  </g>
  <rect x="112" y="236" width="288" height="44" rx="12" fill="none" stroke="#9DB8FF" stroke-opacity="0.55" stroke-width="2"/>
</svg>
